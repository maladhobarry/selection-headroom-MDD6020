[project]
name = "selection-headroom"
version = "0.1.0"
description = "How much can embryo selection gain? Headroom of embryo selection, ceiling for AI and reproducibility of the choice, estimated from sibling blastocyst cohorts (Kromp et al. 2023 open dataset)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
# Exact pins: the analysis must give the same numbers on any machine.
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "statsmodels==0.14.4",
    "matplotlib==3.10.3",
    "pyyaml==6.0.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
# Optional step G (image features). Heavy; install with `uv sync --extra images`.
images = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "pillow==11.2.1",
    "scikit-image==0.25.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.12",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
